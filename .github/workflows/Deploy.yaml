name: Test and Deploy to GitHub Pages
# Trigger the workflow only when changes are pushed to the main branch
on:
  push:
    branches:
      - main  

jobs:
  test-and-build:
    runs-on: ubuntu-latest  # Runs the job on the latest Ubuntu environment

    steps:
      # Step 1: Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v2

      # Step 2: Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '14' # choose version based on your requirement

      # Step 3: Install required dependencies
      - name: Install dependencies
        run: npm install   

      # Step 4: Run tests
      - name: Run tests
        run: npm test  

      # Step 5: Build the project(run the build scripts)
      - name: Build the project
        run: npm run build  

  deploy:
    runs-on: ubuntu-latest
    needs: test-and-build  # Ensures deployment only happens after successful test and build

    steps:
      # Step 1: Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v2

      # Step 2: Deploy to GitHub Pages
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}  # Automatically provided by GitHub Actions
          publish_dir: ./build  # Directory to deploy (change this if your build output is in a different folder)
